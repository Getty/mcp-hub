name    = MCP-Hub
author  = Torsten Raudssus <getty@cpan.org>
license = Perl_5
copyright_holder = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
copyright_year   = 2026

; Getty release command:
;   dzil release
; The [@Author::GETTY] bundle owns the whole release (GatherDir from git,
; PodWeaver, Changes from {{$NEXT}}, GitHub release). Fill the {{$NEXT}}
; section in Changes before releasing; dzil release aborts on an empty one.

[@Author::GETTY]
docker_image = raudssus/mcp-hub

; The standalone binary (README, "Standalone binary"): the bundle packs bin/mcp-hub
; with pp after every dzil build and, per platform, in its dzil-binary workflow
; (.github/workflows/binaries.yml), which attaches the binaries to the GitHub release.
; The -M set is computed by binary_pp_args from a live run (scripts/loaded-modules.pl),
; with the -X set and the Mojolicious resources; binary_require is what the workflow
; checks inside every binary: what mcp-hub loads by name, which pp's scanner misses.
binary           = mcp-hub
binary_platforms = linux-x86_64 linux-arm64 macos-arm64
binary_pp_args   = scripts/binary-pp-args.sh
binary_prepare   = scripts/binary-prepare.sh
binary_verify    = scripts/binary-verify.sh
binary_smoke     = scripts/binary-smoke.sh
binary_require   = MCP::Hub::Command::config MCP::Hub::Command::daemon MCP::Hub::Command::refresh
binary_require   = MCP::Hub::Command::reload MCP::Hub::Command::status MCP::Hub::Command::token
binary_require   = Mojolicious::Command::eval Mojolicious::Command::get Mojolicious::Command::routes
binary_require   = Mojolicious::Command::version
binary_require   = MCP::Hub::Upstream::Stdio MCP::Hub::Upstream::Http MCP::Hub::Upstream::Perl
binary_require   = MCP::Hub::Upstream::Fork MCP::Hub::Upstream::Docker MCP::Hub::Upstream::Compose
binary_require   = MCP::Hub::Upstream::Docker::Engine MCP::Hub::Upstream::Docker::Http
binary_require   = MCP::Hub::Upstream::Docker::Stdio
binary_require   = MCP::Hub::Native::ClaudeHistory MCP::Hub::Native::ClaudeSessions MCP::Hub::Native::Status
binary_require   = YAML::PP Mojo::Reactor::Poll Cpanel::JSON::XS IO::Socket::SSL Net::SSLeay Mozilla::CA
